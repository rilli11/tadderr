function vIn(){if(isAdmin)return `<div class="card"><h2>لوحة المسؤول${admName?' · أهلًا '+esc(admName):''}</h2><p class="mut">افتح/ي التحضير وشاهد/ي كود كل فعالية من تبويب «البرامج». يسجّل الأعضاء حضورهم من حساباتهم بكود الفعالية.</p></div>`;
 if(!me){lmode='login';return vLanding()}
 const open=P.filter(p=>p.status==='open'&&Date.now()<p.codeExp);const rg=RG.find(r=>r.id===me.mid);
 return `<div class="card" id="ckcard" style="max-width:480px;margin:0 auto"><h2>أهلًا ${esc(me.name)} 👋</h2>${rg?`<label class="chk2"><input type="checkbox" ${rg.inC?'checked':''} onchange="setFlag('inC',this.checked)"> منضم/ة للجنة إدارة الفعاليات والتنظيم</label>`:''}${box()}<div class="fl"><button onclick="logout()">تسجيل خروج</button></div></div>`}
var needCert=false;function setCert(v){needCert=v;document.querySelectorAll('.cb-y,.cb-n').forEach(b=>b.classList.remove('p'));document.querySelectorAll(v?'.cb-y':'.cb-n').forEach(b=>b.classList.add('p'))}
async function checkin(){try{if(!me)return sm('er','سجّل/ي دخولك أولًا');const pid=($('#ip')||{}).value,code=norm(($('#ic')||{}).value||''),cert=!!needCert;const p=P.find(x=>x.id===pid);
 if(!p)return sm('er','لا يوجد برنامج للتحضير');
 if(p.mode==='time'){if(p.status!=='open'||Date.now()>p.codeExp)return sm('er','انتهى وقت التحضير');const rf=db.collection('att').doc(pid+'_'+me.mid);if((await rf.get()).exists)return sm('er','سبق إرسال حضورك');await rf.set({pid,mid:me.mid,name:me.name,t:Date.now(),cert,pend:true});await log('حضور (بانتظار الموافقة)',me.name+' ← '+p.name);return sm('ok','وصل حضورك يا '+me.name+' ✔ بانتظار موافقة المسؤول')}
 if(!code)return sm('er','أدخل/ي كود الفعالية');
 if(!p.codeHash||Date.now()>p.codeExp||p.status!=='open')return sm('er','التحضير مغلق أو انتهت صلاحية الكود');
 if(p.codeHash!==await sha(pid+code))return sm('er','الكود غير صحيح لهذه الفعالية');
 const ref=db.collection('att').doc(pid+'_'+me.mid);if((await ref.get()).exists)return sm('er','سبق تسجيل حضورك في هذه الفعالية');
 await ref.set({pid,mid:me.mid,name:me.name,t:Date.now(),cert});await log('حضور',me.name+' ← '+p.name);sm('ok',`تم تسجيل حضورك يا ${me.name} في «${p.name}» ✔${cert?' · تم تسجيل طلب الإفادة':''}`)}catch(e){sm('er','حدث خطأ: '+(e.message||e.code))}}
async function saveM(m){await db.collection('members').doc(m.id).set(m);await db.collection('names').doc(m.id).set({name:m.name,active:!!m.active});await db.collection('auth').doc(m.id).set({h:await sha(m.id+m.phone),active:m.active,name:m.name})}
